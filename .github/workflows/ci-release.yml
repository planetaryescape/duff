name: CI and Release

on:
  pull_request:
  push:
    branches: [main, feat/standalone-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run package

  native-check:
    name: Native static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('scripts/rune-review-prototype/Cargo.toml') != ''
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        if: hashFiles('scripts/rune-review-prototype/Cargo.toml') != ''
        with:
          workspaces: scripts/rune-review-prototype -> target
      - name: Install native build dependencies
        if: hashFiles('scripts/rune-review-prototype/Cargo.toml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev
      - name: Check Rust formatting and types
        if: hashFiles('scripts/rune-review-prototype/Cargo.toml') != ''
        env:
          RUSTUP_TOOLCHAIN: '1.98.1'
        run: |
          bash scripts/rune-review-prototype/native.sh fmt -- --check
          bash scripts/rune-review-prototype/native.sh check --locked

  release:
    name: Plan release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Publish VSIX to GitHub
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run package
      - name: Verify version and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="$(bun -p 'require("./packages/extension/package.json").version')"
          test "$RELEASE_TAG" = "v$version"
          vsix="packages/extension/duff-$version.vsix"
          test -f "$vsix"
          gh release upload "$RELEASE_TAG" "$vsix" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
